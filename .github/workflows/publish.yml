name: publish

# npm Trusted Publishing: GitHub Actions authenticates to npm with OIDC
# (no access token and no OTP). Configure the trusted publisher once on
# npmjs.com → package settings → Trusted publishing, with:
#   organization/user: lulaalu
#   repository:        dsh-session-tree
#   workflow file:     publish.yml
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10, which
      # signs provenance and then sends the PUT without a credential (E404).
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Install-free checks
        run: |
          node --check index.js
          node --check client.js
          node test/render-smoke.mjs

      - name: Publish
        run: npm publish --access public --provenance
